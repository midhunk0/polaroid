<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Polaroid Sheet Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
<style>
  :root{
    --ink: #2a2622;
    --paper: #fbfaf7;
    --darkroom: #1c1a17;
    --darkroom-2: #262320;
    --sand: #cabfa9;
    --sand-dim: #8f8571;
    --safelight: #c8391f;
    --safelight-dim: #a52e18;
    --cutline: #d6d2c8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--darkroom);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(200,57,31,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(200,57,31,0.05), transparent 45%);
    color: var(--paper);
    font-family: 'Inter', system-ui, sans-serif;
    min-height:100vh;
  }

  .app{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding: 28px 16px 60px;
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    width:100%;
    max-width: 900px;
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    align-items:center;
    justify-content:space-between;
    padding: 14px 20px;
    background: var(--darkroom-2);
    border: 1px solid #3a352e;
    border-radius: 4px;
    margin-bottom: 28px;
  }
  .brand{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .brand h1{
    font-family:'Special Elite', monospace;
    font-size: 19px;
    letter-spacing: 0.5px;
    margin:0;
    color: var(--paper);
  }
  .brand span{
    font-size: 12px;
    color: var(--sand-dim);
  }
  .controls-group{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
  }
  .segmented{
    display:flex;
    border: 1px solid var(--sand-dim);
    border-radius: 4px;
    overflow:hidden;
  }
  .segmented button{
    background: transparent;
    color: var(--sand);
    border:none;
    padding: 9px 16px;
    font-size: 13px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    border-right: 1px solid var(--sand-dim);
    transition: background .15s ease, color .15s ease;
  }
  .segmented button:last-child{border-right:none;}
  .segmented button.active{
    background: var(--safelight);
    color: #fff;
  }
  .segmented button:hover:not(.active){
    background: rgba(255,255,255,0.06);
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:7px;
    background: var(--safelight);
    color:#fff;
    border:none;
    padding: 10px 16px;
    border-radius: 4px;
    font-size: 13px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    transition: background .15s ease, transform .1s ease;
  }
  .btn:hover{ background: var(--safelight-dim); }
  .btn:active{ transform: scale(0.97); }
  .btn.ghost{
    background: transparent;
    border: 1px solid var(--sand-dim);
    color: var(--sand);
  }
  .btn.ghost:hover{ background: rgba(255,255,255,0.06); }
  .btn svg{ width:14px; height:14px; flex-shrink:0; }

  .hint{
    max-width: 900px;
    width:100%;
    font-size: 12.5px;
    color: var(--sand-dim);
    margin-bottom: 22px;
    line-height:1.5;
  }
  .hint b{ color: var(--sand); }

  /* ---------- Sheet (A4) ---------- */
  .sheet-shell{
    background: #0f0d0b;
    padding: 22px;
    border-radius: 6px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
  }
  .sheet{
    width: 210mm;
    height: 297mm;
    background: var(--paper);
    display:grid;
  }
  .sheet.count-1{
    grid-template-columns: 1fr;
    grid-template-rows: 1fr;
  }
  .sheet.count-2{
    grid-template-columns: 1fr;
    grid-template-rows: repeat(2, 1fr);
  }
  .sheet.count-4{
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
  }
  .sheet.count-8{
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(4, 1fr);
  }
  .sheet.count-16{
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
  }

  /* ---------- Polaroid cell ---------- */
  .cell{
    position:relative;
    background:#fff;
    overflow:hidden;
  }
  .cell.border-top{ border-top: 1px solid var(--cutline); }
  .cell.border-left{ border-left: 1px solid var(--cutline); }

  .card{
    position:absolute;
    inset:0;
    display:flex;
  }
  .card.portrait{ flex-direction: column; }
  .card.landscape{ flex-direction: row; }

  .photo-window{
    position:relative;
    flex: 1 1 auto;
    overflow:hidden;
    background: #e9e5dc repeating-linear-gradient(45deg, #e9e5dc, #e9e5dc 8px, #ded9cd 8px, #ded9cd 16px);
    cursor: grab;
    margin: 4mm 4mm 0 4mm;
  }
  .card.portrait .photo-window{ margin: 4mm 4mm 0 4mm; }
  .card.landscape .photo-window{ margin: 4mm 0 4mm 4mm; }
  .photo-window.dragging{ cursor: grabbing; }
  .photo-window.has-img{ background:#fff; }
  .photo-window img{
    position:absolute;
    top:50%; left:50%;
    max-width:none;
    width:100%;
    height:100%;
    object-fit:contain;
    user-select:none;
    -webkit-user-drag:none;
    transform-origin:center center;
  }
  .photo-window img.fill{ object-fit:cover; }

  .empty-slot{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    color:#9c9284;
    font-size: 11.5px;
    text-align:center;
    padding: 0 10px;
  }
  .empty-slot svg{ width:22px; height:22px; opacity:0.7; }

  .caption-strip{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    position:relative;
    overflow:hidden;
  }
  .card.portrait .caption-strip{
    height: 9mm;
    margin: 0 4mm 4mm 4mm;
  }
  .card.landscape .caption-strip{
    width: 9mm;
    margin: 4mm 4mm 4mm 0;
  }
  .count-16 .card.portrait .caption-strip{ height: 6mm; margin: 0 2.5mm 2.5mm 2.5mm; }
  .count-16 .card.landscape .caption-strip{ width: 6mm; margin: 2.5mm 2.5mm 2.5mm 0; }
  .count-16 .card.portrait .photo-window{ margin: 2.5mm 2.5mm 0 2.5mm; }
  .count-16 .card.landscape .photo-window{ margin: 2.5mm 0 2.5mm 2.5mm; }

  /* Larger frames get a proportionally larger white border + caption */
  .count-1 .card.portrait .caption-strip{ height: 26mm; margin: 0 14mm 14mm 14mm; }
  .count-1 .card.landscape .caption-strip{ width: 26mm; margin: 14mm 14mm 14mm 0; }
  .count-1 .card.portrait .photo-window{ margin: 14mm 14mm 0 14mm; }
  .count-1 .card.landscape .photo-window{ margin: 14mm 0 14mm 14mm; }
  .count-1 .caption, .count-1 .caption-display{ font-size: 22px; }
  .count-1 .empty-slot{ font-size: 16px; }
  .count-1 .empty-slot svg{ width:36px; height:36px; }

  .count-2 .card.portrait .caption-strip{ height: 18mm; margin: 0 9mm 9mm 9mm; }
  .count-2 .card.landscape .caption-strip{ width: 18mm; margin: 9mm 9mm 9mm 0; }
  .count-2 .card.portrait .photo-window{ margin: 9mm 9mm 0 9mm; }
  .count-2 .card.landscape .photo-window{ margin: 9mm 0 9mm 9mm; }
  .count-2 .caption, .count-2 .caption-display{ font-size: 16px; }

  .count-4 .card.portrait .caption-strip{ height: 13mm; margin: 0 6mm 6mm 6mm; }
  .count-4 .card.landscape .caption-strip{ width: 13mm; margin: 6mm 6mm 6mm 0; }
  .count-4 .card.portrait .photo-window{ margin: 6mm 6mm 0 6mm; }
  .count-4 .card.landscape .photo-window{ margin: 6mm 0 6mm 6mm; }
  .count-4 .caption, .count-4 .caption-display{ font-size: 13px; }

  /* Full-bleed cell: photo fills the entire grid cell, no white frame or caption */
  .card.full{ display:block; }
  .card.full .photo-window{ position:absolute; inset:0; margin:0 !important; }
  .card.full .caption-strip{ display:none; }

  .caption{
    font-family:'Special Elite', monospace;
    font-size: 11px;
    color:#3a352e;
    border:none;
    outline:none;
    background:transparent;
    text-align:center;
    width:100%;
  }
  .card.landscape .caption{
    display:none;
  }
  .caption-hidden-input{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:0;
    cursor:text;
    z-index:2;
  }
  .caption-display{
    position:absolute;
    top:50%;
    left:50%;
    transform: translate(-50%, -50%) rotate(-90deg);
    white-space:nowrap;
    font-family:'Special Elite', monospace;
    font-size:11px;
    color:#3a352e;
    pointer-events:none;
    z-index:1;
  }
  .caption-placeholder{ color:#c4bcac; }
  .caption::placeholder{ color:#c4bcac; }

  .cell-tools{
    position:absolute;
    top:4px;
    right:4px;
    left:4px;
    display:flex;
    justify-content:flex-end;
    gap:4px;
    z-index:5;
    opacity:0;
    transition: opacity .12s ease;
  }
  .cell:hover .cell-tools{ opacity:1; }
  .tool-btn{
    width:24px;
    height:24px;
    border-radius:3px;
    border:none;
    background: rgba(28,26,23,0.78);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .tool-btn:hover{ background: var(--safelight); }
  .tool-btn.on{ background: var(--safelight); }
  .tool-btn svg{ width:13px; height:13px; }

  .zoom-row{
    position:absolute;
    left:6px;
    right:6px;
    bottom:6px;
    z-index:5;
    opacity:0;
    transition: opacity .12s ease;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .cell:hover .zoom-row{ opacity:1; }
  .zoom-row input[type=range]{
    flex:1;
    accent-color: var(--safelight);
    height:14px;
  }

  footer.foot{
    max-width:900px;
    width:100%;
    text-align:center;
    color: var(--sand-dim);
    font-size:11.5px;
    margin-top: 26px;
    line-height:1.6;
  }

  /* ---------- Mobile step-by-step wizard ---------- */
  .wizard{
    width:100%;
    max-width: 460px;
  }
  .wizard-setup{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .layout-choice{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    background: var(--darkroom-2);
    border: 1px solid #3a352e;
    border-radius: 5px;
    padding: 16px 18px;
    cursor:pointer;
    text-align:left;
  }
  .layout-choice:active{ background: rgba(200,57,31,0.15); border-color: var(--safelight); }
  .layout-choice-label{
    font-family:'Special Elite', monospace;
    font-size: 16px;
    color: var(--paper);
  }
  .layout-choice-sub{
    font-size: 12px;
    color: var(--sand-dim);
  }

  .wizard-progress{
    text-align:center;
    font-size: 12px;
    font-weight:600;
    letter-spacing:0.4px;
    color: var(--sand-dim);
    margin-bottom: 14px;
    text-transform:uppercase;
  }

  /* Single-slot editor: reuses the exact card/photo-window/caption-strip
     rules (and count-N border scaling) that the real sheet uses, just
     zoomed up to a comfortable editing size — so proportions match the
     final print exactly, not an approximation. */
  .editor-cell-wrap{
    position:relative;
    margin: 0 auto 18px;
  }
  .editor-cell-zoom{
    position:relative;
    background:#fff;
    overflow:hidden;
    box-shadow: 0 14px 34px rgba(0,0,0,0.4);
  }
  .cell-tools.mobile-visible,
  .zoom-row.mobile-visible{
    opacity:1;
  }
  .cell-tools.mobile-visible{
    flex-wrap:wrap;
    justify-content:flex-start;
    gap:6px;
  }
  .cell-tools.mobile-visible .tool-btn{
    width:30px;
    height:30px;
  }
  .cell-tools.mobile-visible .tool-btn svg{ width:15px; height:15px; }
  .zoom-row.mobile-visible{
    left:8px;
    right:8px;
    bottom:8px;
  }

  .editor-nav{
    display:flex;
    gap:10px;
    margin-top: 8px;
    margin-bottom: 6px;
  }
  .editor-nav .btn{ flex:1; justify-content:center; }

  .mobile-preview-shell{
    width:100%;
    max-width: 420px;
    background: #0f0d0b;
    padding: 14px;
    border-radius: 6px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    display:flex;
    justify-content:center;
  }
  .mobile-preview-shell .sheet{
    background: var(--paper);
  }
  .mobile-preview-shell .cell{ cursor:pointer; }
  .mobile-preview-shell .empty-slot span{ font-size:10px; }


  /* ---------- Print ---------- */
  @media print{
    @page{ size:A4; margin:0; }
    html, body{ background:#fff !important; }
    .no-print{ display:none !important; }
    .app{ padding:0; min-height:0; }
    .sheet-shell{ box-shadow:none; padding:0; background:#fff; display:block !important; }
    .sheet{ width:210mm !important; height:297mm !important; zoom:1 !important; }
    .cell-tools, .zoom-row{ display:none !important; }
    .photo-window{ background: transparent; cursor:default; }
    .caption::placeholder{ color: transparent; }
    .caption-placeholder{ color: transparent; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect } = React;

/* ---------- shared photo upload/HEIC handling ---------- */
const isHeicFile = (file) =>
  /image\/hei[cf]/i.test(file.type) || /\.hei[cf]$/i.test(file.name || "");

const readFileAsDataUrl = (file) =>
  new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => resolve(ev.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });

const canDisplayDataUrl = (dataUrl) =>
  new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = dataUrl;
  });

async function uploadImageFile(file, { setConverting, onUploaded }) {
  let rawUrl;
  try {
    rawUrl = await readFileAsDataUrl(file);
  } catch (err) {
    alert("Couldn't read that file — please try a different one.");
    return;
  }
  if (await canDisplayDataUrl(rawUrl)) {
    onUploaded(rawUrl);
    return;
  }
  if (!window.heic2any) {
    alert("This photo couldn't be displayed as-is (it looks like a HEIC/HEIF file), and the converter needed for that didn't load — check your internet connection and try again.");
    return;
  }
  setConverting(true);
  try {
    const converted = await window.heic2any({ blob: file, toType: "image/jpeg", quality: 0.9 });
    const convertedBlob = Array.isArray(converted) ? converted[0] : converted;
    const convertedUrl = await readFileAsDataUrl(convertedBlob);
    onUploaded(convertedUrl);
  } catch (err) {
    alert("Couldn't convert this photo. If it's a HEIC file, try exporting/sharing it as JPEG first and upload that instead.");
  } finally {
    setConverting(false);
  }
}

const useIsMobile = () => {
  const [isMobile, setIsMobile] = useState(
    () => typeof window !== "undefined" && window.matchMedia("(max-width: 720px)").matches
  );
  useEffect(() => {
    const mq = window.matchMedia("(max-width: 720px)");
    const handler = (e) => setIsMobile(e.matches);
    if (mq.addEventListener) mq.addEventListener("change", handler);
    else mq.addListener(handler);
    return () => {
      if (mq.removeEventListener) mq.removeEventListener("change", handler);
      else mq.removeListener(handler);
    };
  }, []);
  return isMobile;
};

/* ---------- tiny icon set ---------- */
const Icon = {
  RotateLeft: (p) => (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" {...p}>
      <path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" />
    </svg>
  ),
  RotateRight: (p) => (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" {...p}>
      <path d="M21 12a9 9 0 1 1-3-6.7" /><path d="M21 4v5h-5" />
    </svg>
  ),
  Flip: (p) => (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" {...p}>
      <path d="M12 3v18" /><path d="M16 7l4 5-4 5" /><path d="M8 7l-4 5 4 5" />
    </svg>
  ),
  Trash: (p) => (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
      <path d="M3 6h18" /><path d="M8 6V4h8v2" /><path d="M19 6l-1 14H6L5 6" />
    </svg>
  ),
  Upload: (p) => (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" {...p}>
      <path d="M12 16V4" /><path d="M7 9l5-5 5 5" /><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" />
    </svg>
  ),
  Print: (p) => (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
      <path d="M6 9V2h12v7" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect x="6" y="14" width="12" height="8" />
    </svg>
  ),
  Portrait: (p) => (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
      <rect x="6" y="3" width="12" height="18" rx="1.5" />
    </svg>
  ),
  Landscape: (p) => (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
      <rect x="3" y="6" width="18" height="12" rx="1.5" />
    </svg>
  ),
  Framed: (p) => (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
      <rect x="4" y="3" width="16" height="18" rx="1" /><line x1="4" y1="16" x2="20" y2="16" />
    </svg>
  ),
  FullBleed: (p) => (
    <svg viewBox="0 0 24 24" fill="currentColor" {...p}>
      <rect x="3" y="3" width="18" height="18" rx="1" />
    </svg>
  ),
  Fit: (p) => (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
      <rect x="3" y="3" width="18" height="18" rx="1" /><rect x="6.5" y="9" width="11" height="6" />
    </svg>
  ),
  Fill: (p) => (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
      <rect x="3" y="3" width="18" height="18" rx="1" />
      <path d="M8 10l3-3 3 3" /><path d="M16 14l-3 3-3-3" />
    </svg>
  ),
};

const emptySlot = () => ({
  image: null, rotation: 0, flip: false, scale: 1, x: 0, y: 0, caption: "", orientation: "portrait", frame: "polaroid", fit: "fit"
});

// CSS mm are an absolute unit (~96dpi reference); used to size the mobile
// editor/preview so their proportions are pixel-for-pixel the same ratio
// as the real, print-accurate sheet — just uniformly zoomed for legibility.
const PX_PER_MM = 3.7795275591;
const gridDims = (count) => {
  const cols = count === 1 || count === 2 ? 1 : count === 4 || count === 8 ? 2 : 4;
  const rows = count / cols;
  return { cols, rows, cellWidthMM: 210 / cols, cellHeightMM: 297 / rows };
};

function Cell({ slot, isFirstRow, isFirstCol, onUpload, onRotate, onFlip, onZoom, onDrag, onRemove, onCaption, onOrientation, onFrameStyle, onFit }) {
  const fileInput = useRef(null);
  const dragState = useRef(null);
  const [dragging, setDragging] = useState(false);

  const openFile = () => fileInput.current && fileInput.current.click();
  const [converting, setConverting] = useState(false);

  const processFile = (file) => uploadImageFile(file, { setConverting, onUploaded: onUpload });

  const handleFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    processFile(file);
  };

  const handleDrop = (e) => {
    e.preventDefault();
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (!file) return;
    if (!file.type.startsWith("image/") && !isHeicFile(file)) return;
    processFile(file);
  };

  const startDrag = (e) => {
    if (!slot.image) return;
    e.preventDefault();
    dragState.current = { startX: e.clientX, startY: e.clientY, origX: slot.x, origY: slot.y };
    setDragging(true);
    window.addEventListener("pointermove", moveDrag);
    window.addEventListener("pointerup", endDrag);
  };
  const moveDrag = (e) => {
    if (!dragState.current) return;
    const dx = e.clientX - dragState.current.startX;
    const dy = e.clientY - dragState.current.startY;
    onDrag(dragState.current.origX + dx, dragState.current.origY + dy);
  };
  const endDrag = () => {
    dragState.current = null;
    setDragging(false);
    window.removeEventListener("pointermove", moveDrag);
    window.removeEventListener("pointerup", endDrag);
  };

  const transform = `translate(-50%, -50%) translate(${slot.x}px, ${slot.y}px) rotate(${slot.rotation}deg) scaleX(${slot.flip ? -1 : 1}) scale(${slot.scale})`;

  const cellClass = "cell" + (isFirstRow ? "" : " border-top") + (isFirstCol ? "" : " border-left");

  return (
    <div className={cellClass}>
      {slot.image && (
        <div className="cell-tools no-print">
          <button className={"tool-btn" + (slot.frame === "polaroid" ? " on" : "")} title="Polaroid frame" onClick={() => onFrameStyle("polaroid")}><Icon.Framed/></button>
          <button className={"tool-btn" + (slot.frame === "full" ? " on" : "")} title="Full cell (no frame)" onClick={() => onFrameStyle("full")}><Icon.FullBleed/></button>
          {slot.frame === "polaroid" && (
            <React.Fragment>
              <button className={"tool-btn" + (slot.orientation === "portrait" ? " on" : "")} title="Portrait" onClick={() => onOrientation("portrait")}><Icon.Portrait/></button>
              <button className={"tool-btn" + (slot.orientation === "landscape" ? " on" : "")} title="Landscape" onClick={() => onOrientation("landscape")}><Icon.Landscape/></button>
            </React.Fragment>
          )}
          <button className={"tool-btn" + (slot.fit === "fit" ? " on" : "")} title="Fit whole image" onClick={() => onFit("fit")}><Icon.Fit/></button>
          <button className={"tool-btn" + (slot.fit === "fill" ? " on" : "")} title="Fill frame (crop)" onClick={() => onFit("fill")}><Icon.Fill/></button>
          <button className="tool-btn" title="Rotate left" onClick={onRotate.bind(null,-90)}><Icon.RotateLeft/></button>          <button className="tool-btn" title="Rotate right" onClick={onRotate.bind(null,90)}><Icon.RotateRight/></button>
          <button className="tool-btn" title="Flip" onClick={onFlip}><Icon.Flip/></button>
          <button className="tool-btn" title="Remove" onClick={onRemove}><Icon.Trash/></button>
        </div>
      )}

      <div className={"card " + (slot.frame === "full" ? "full" : slot.orientation)}>
        <div
          className={"photo-window" + (slot.image ? " has-img" : "") + (dragging ? " dragging" : "")}
          onClick={!slot.image ? openFile : undefined}
          onDrop={handleDrop}
          onDragOver={(e) => e.preventDefault()}
          onPointerDown={startDrag}
        >
          {slot.image ? (
            <img src={slot.image} className={slot.fit === "fill" ? "fill" : ""} style={{ transform }} draggable="false" alt="" />
          ) : converting ? (
            <div className="empty-slot no-print">
              <span>Converting HEIC photo…</span>
            </div>
          ) : (
            <div className="empty-slot no-print">
              <Icon.Upload />
              <span>Click or drop a<br/>photo here</span>
            </div>
          )}
          {slot.image && (
            <div className="zoom-row no-print" onPointerDown={(e) => e.stopPropagation()}>
              <input
                type="range" min="0.3" max="3" step="0.02" value={slot.scale}
                onChange={(e) => onZoom(parseFloat(e.target.value))}
              />
            </div>
          )}
        </div>

        <div className="caption-strip">
          {slot.orientation === "landscape" ? (
            <React.Fragment>
              <input
                className="caption caption-hidden-input"
                value={slot.caption}
                onChange={(e) => onCaption(e.target.value)}
              />
              <div className="caption-display">
                {slot.caption ? slot.caption : <span className="caption-placeholder">note…</span>}
              </div>
            </React.Fragment>
          ) : (
            <input
              className="caption"
              placeholder="note…"
              value={slot.caption}
              onChange={(e) => onCaption(e.target.value)}
            />
          )}
        </div>
      </div>


      <input ref={fileInput} type="file" accept="image/*,.heic,.heif" style={{ display: "none" }} onChange={handleFile} />
    </div>
  );
}

/* ---------- Mobile: one big editor for a single slot at a time.
   Renders the exact same card/photo-window/caption-strip markup (and
   count-N CSS scoping) as the real print sheet, just zoomed up — so the
   border thickness and proportions are identical to the final piece. ---------- */
function SlotEditor({ slot, index, count, fromPreview, onUpload, onRotate, onFlip, onZoom, onDrag, onRemove, onCaption, onOrientation, onFrameStyle, onFit, onBack, onNext }) {
  const fileInput = useRef(null);
  const dragState = useRef(null);
  const [dragging, setDragging] = useState(false);
  const [converting, setConverting] = useState(false);

  const openFile = () => fileInput.current && fileInput.current.click();

  const handleFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    uploadImageFile(file, { setConverting, onUploaded: onUpload });
  };

  const { cellWidthMM, cellHeightMM } = gridDims(count);
  const targetPx = Math.min((typeof window !== "undefined" ? window.innerWidth : 380) - 64, 360);
  const zoomFactor = targetPx / (cellWidthMM * PX_PER_MM);
  const outerWidthPx = cellWidthMM * PX_PER_MM * zoomFactor;
  const outerHeightPx = cellHeightMM * PX_PER_MM * zoomFactor;

  const startDrag = (e) => {
    if (!slot.image) return;
    e.preventDefault();
    dragState.current = { startX: e.clientX, startY: e.clientY, origX: slot.x, origY: slot.y };
    setDragging(true);
    window.addEventListener("pointermove", moveDrag);
    window.addEventListener("pointerup", endDrag);
  };
  const moveDrag = (e) => {
    if (!dragState.current) return;
    const dx = (e.clientX - dragState.current.startX) / zoomFactor;
    const dy = (e.clientY - dragState.current.startY) / zoomFactor;
    onDrag(dragState.current.origX + dx, dragState.current.origY + dy);
  };
  const endDrag = () => {
    dragState.current = null;
    setDragging(false);
    window.removeEventListener("pointermove", moveDrag);
    window.removeEventListener("pointerup", endDrag);
  };

  const transform = `translate(-50%, -50%) translate(${slot.x}px, ${slot.y}px) rotate(${slot.rotation}deg) scaleX(${slot.flip ? -1 : 1}) scale(${slot.scale})`;
  const frameClass = slot.frame === "full" ? "full" : slot.orientation;

  return (
    <div className="wizard">
      <div className="wizard-progress">Photo {index + 1} of {count}</div>

      <div className="editor-cell-wrap" style={{ width: outerWidthPx + "px", height: outerHeightPx + "px" }}>
        <div
          className={"editor-cell-zoom count-" + count}
          style={{ width: cellWidthMM + "mm", height: cellHeightMM + "mm", zoom: zoomFactor }}
        >
          <div className={"card " + frameClass}>
            <div
              className={"photo-window" + (slot.image ? " has-img" : "") + (dragging ? " dragging" : "")}
              onClick={!slot.image ? openFile : undefined}
              onPointerDown={startDrag}
            >
              {slot.image ? (
                <img src={slot.image} className={slot.fit === "fill" ? "fill" : ""} style={{ transform }} draggable="false" alt="" />
              ) : converting ? (
                <div className="empty-slot"><span>Converting HEIC photo…</span></div>
              ) : (
                <div className="empty-slot"><Icon.Upload /><span>Tap to add a photo</span></div>
              )}
            </div>
            <div className="caption-strip">
              {slot.orientation === "landscape" ? (
                <React.Fragment>
                  <input className="caption caption-hidden-input" value={slot.caption} onChange={(e) => onCaption(e.target.value)} />
                  <div className="caption-display">{slot.caption ? slot.caption : <span className="caption-placeholder">note…</span>}</div>
                </React.Fragment>
              ) : (
                <input className="caption" placeholder="note…" value={slot.caption} onChange={(e) => onCaption(e.target.value)} />
              )}
            </div>
          </div>
        </div>

        {slot.image && (
          <div className="cell-tools mobile-visible no-print">
            <button className={"tool-btn" + (slot.frame === "polaroid" ? " on" : "")} title="Polaroid frame" onClick={() => onFrameStyle("polaroid")}><Icon.Framed /></button>
            <button className={"tool-btn" + (slot.frame === "full" ? " on" : "")} title="Full cell (no frame)" onClick={() => onFrameStyle("full")}><Icon.FullBleed /></button>
            {slot.frame === "polaroid" && (
              <React.Fragment>
                <button className={"tool-btn" + (slot.orientation === "portrait" ? " on" : "")} title="Portrait" onClick={() => onOrientation("portrait")}><Icon.Portrait /></button>
                <button className={"tool-btn" + (slot.orientation === "landscape" ? " on" : "")} title="Landscape" onClick={() => onOrientation("landscape")}><Icon.Landscape /></button>
              </React.Fragment>
            )}
            <button className={"tool-btn" + (slot.fit === "fit" ? " on" : "")} title="Fit whole image" onClick={() => onFit("fit")}><Icon.Fit /></button>
            <button className={"tool-btn" + (slot.fit === "fill" ? " on" : "")} title="Fill frame (crop)" onClick={() => onFit("fill")}><Icon.Fill /></button>
            <button className="tool-btn" title="Rotate left" onClick={onRotate.bind(null, -90)}><Icon.RotateLeft /></button>
            <button className="tool-btn" title="Rotate right" onClick={onRotate.bind(null, 90)}><Icon.RotateRight /></button>
            <button className="tool-btn" title="Flip" onClick={onFlip}><Icon.Flip /></button>
            <button className="tool-btn" title="Remove" onClick={onRemove}><Icon.Trash /></button>
          </div>
        )}

        {slot.image && (
          <div className="zoom-row mobile-visible no-print" onPointerDown={(e) => e.stopPropagation()}>
            <input
              type="range" min="0.3" max="3" step="0.02" value={slot.scale}
              onChange={(e) => onZoom(parseFloat(e.target.value))}
            />
          </div>
        )}
      </div>

      <input ref={fileInput} type="file" accept="image/*,.heic,.heif" style={{ display: "none" }} onChange={handleFile} />

      <div className="editor-nav">
        <button className="btn ghost" onClick={onBack}>{fromPreview ? "Cancel" : (index === 0 ? "Change layout" : "Back")}</button>
        <button className="btn" onClick={onNext}>{fromPreview ? "Done" : (index === count - 1 ? "Review sheet" : "Next photo")}</button>
      </div>
    </div>
  );
}

/* ---------- Mobile: read-only tap-to-edit thumbnail of the whole sheet ---------- */
function PreviewCell({ slot, isFirstRow, isFirstCol, onTap }) {
  const cellClass = "cell" + (isFirstRow ? "" : " border-top") + (isFirstCol ? "" : " border-left");
  const transform = `translate(-50%, -50%) translate(${slot.x}px, ${slot.y}px) rotate(${slot.rotation}deg) scaleX(${slot.flip ? -1 : 1}) scale(${slot.scale})`;
  const frameClass = slot.frame === "full" ? "full" : slot.orientation;
  return (
    <div className={cellClass} onClick={onTap}>
      <div className={"card " + frameClass}>
        <div className={"photo-window" + (slot.image ? " has-img" : "")}>
          {slot.image ? (
            <img src={slot.image} className={slot.fit === "fill" ? "fill" : ""} style={{ transform }} draggable="false" alt="" />
          ) : (
            <div className="empty-slot">
              <Icon.Upload />
              <span>Tap to add</span>
            </div>
          )}
        </div>
        <div className="caption-strip">
          {slot.orientation === "landscape" ? (
            <div className="caption-display">{slot.caption ? slot.caption : <span className="caption-placeholder">note…</span>}</div>
          ) : (
            <div className="caption">{slot.caption ? slot.caption : <span className="caption-placeholder">note…</span>}</div>
          )}
        </div>
      </div>
    </div>
  );
}

function App() {
  const isMobile = useIsMobile();
  const [count, setCount] = useState(8);
  const [slots, setSlots] = useState(Array.from({ length: 8 }, emptySlot));
  const [wizardStep, setWizardStep] = useState("setup"); // setup | fill | preview
  const [activeIndex, setActiveIndex] = useState(0);
  const [fromPreview, setFromPreview] = useState(false);

  const cols = count === 1 || count === 2 ? 1 : count === 4 || count === 8 ? 2 : 4;

  const changeCount = (n) => {
    setCount(n);
    setSlots((prev) => {
      const next = Array.from({ length: n }, (_, i) => prev[i] || emptySlot());
      return next;
    });
  };

  const updateSlot = (index, patch) => {
    setSlots((prev) => prev.map((s, i) => (i === index ? { ...s, ...patch } : s)));
  };

  const clearAll = () => {
    if (window.confirm("Clear every photo on this sheet?")) {
      setSlots(Array.from({ length: count }, emptySlot));
    }
  };

  const filled = slots.filter((s) => s.image).length;

  // ---- mobile wizard navigation ----
  const chooseLayout = (n) => {
    changeCount(n);
    setActiveIndex(0);
    setFromPreview(false);
    setWizardStep("fill");
  };
  const goNext = () => {
    if (fromPreview) { setWizardStep("preview"); return; }
    if (activeIndex < count - 1) setActiveIndex(activeIndex + 1);
    else setWizardStep("preview");
  };
  const goBack = () => {
    if (fromPreview) { setWizardStep("preview"); return; }
    if (activeIndex > 0) setActiveIndex(activeIndex - 1);
    else setWizardStep("setup");
  };
  const openCellEditor = (i) => {
    setActiveIndex(i);
    setFromPreview(true);
    setWizardStep("fill");
  };

  const layoutOptions = [
    { n: 1, label: "Full page", sub: "1 large polaroid" },
    { n: 2, label: "2 up", sub: "2 polaroids" },
    { n: 4, label: "4 up", sub: "4 polaroids" },
    { n: 8, label: "8 up", sub: "8 polaroids" },
    { n: 16, label: "16 up", sub: "16 polaroids" },
  ];

  return (
    <div className="app">
      <div className="toolbar no-print">
        <div className="brand">
          <h1>Polaroid Sheet Maker</h1>
          <span>{filled} of {count} frames filled · A4</span>
        </div>
        {isMobile ? (
          <div className="controls-group">
            {wizardStep === "preview" && (
              <React.Fragment>
                <button className="btn ghost" onClick={() => setWizardStep("setup")}>Change layout</button>
                <button className="btn" onClick={() => window.print()}><Icon.Print /> Print / Save as PDF</button>
              </React.Fragment>
            )}
            {wizardStep !== "preview" && filled > 0 && (
              <button className="btn ghost" onClick={clearAll}><Icon.Trash /> Clear</button>
            )}
          </div>
        ) : (
          <div className="controls-group">
            <div className="segmented">
              <button className={count === 1 ? "active" : ""} onClick={() => changeCount(1)}>Full page</button>
              <button className={count === 2 ? "active" : ""} onClick={() => changeCount(2)}>2 up</button>
              <button className={count === 4 ? "active" : ""} onClick={() => changeCount(4)}>4 up</button>
              <button className={count === 8 ? "active" : ""} onClick={() => changeCount(8)}>8 up</button>
              <button className={count === 16 ? "active" : ""} onClick={() => changeCount(16)}>16 up</button>
            </div>
            <button className="btn ghost" onClick={clearAll}><Icon.Trash /> Clear</button>
            <button className="btn" onClick={() => window.print()}><Icon.Print /> Print / Save as PDF</button>
          </div>
        )}
      </div>

      {isMobile && wizardStep === "setup" && (
        <div className="wizard">
          <p className="hint no-print">
            Choose how many polaroids you want on this A4 sheet. You'll add and adjust each photo one at a time, then preview the full sheet before printing.
          </p>
          <div className="wizard-setup">
            {layoutOptions.map((opt) => (
              <button key={opt.n} className="layout-choice" onClick={() => chooseLayout(opt.n)}>
                <span className="layout-choice-label">{opt.label}</span>
                <span className="layout-choice-sub">{opt.sub}</span>
              </button>
            ))}
            {filled > 0 && (
              <button className="btn ghost" style={{ width: "100%", justifyContent: "center", marginTop: 4 }} onClick={() => setWizardStep("preview")}>
                Continue with current photos
              </button>
            )}
          </div>
        </div>
      )}

      {isMobile && wizardStep === "fill" && (
        <SlotEditor
          slot={slots[activeIndex]}
          index={activeIndex}
          count={count}
          fromPreview={fromPreview}
          onUpload={(img) => updateSlot(activeIndex, { image: img, rotation: 0, flip: false, scale: 1, x: 0, y: 0, fit: "fit" })}
          onRotate={(delta) => updateSlot(activeIndex, { rotation: (slots[activeIndex].rotation + delta + 360) % 360 })}
          onFlip={() => updateSlot(activeIndex, { flip: !slots[activeIndex].flip })}
          onZoom={(scale) => updateSlot(activeIndex, { scale })}
          onDrag={(x, y) => updateSlot(activeIndex, { x, y })}
          onRemove={() => updateSlot(activeIndex, emptySlot())}
          onCaption={(caption) => updateSlot(activeIndex, { caption })}
          onOrientation={(orientation) => updateSlot(activeIndex, { orientation })}
          onFrameStyle={(frame) => updateSlot(activeIndex, { frame })}
          onFit={(fit) => updateSlot(activeIndex, { fit })}
          onBack={goBack}
          onNext={goNext}
        />
      )}

      {isMobile && wizardStep === "preview" && (
        <React.Fragment>
          <p className="hint no-print" style={{ textAlign: "center" }}>Tap any polaroid to make changes.</p>
          <div className="mobile-preview-shell no-print">
            <div
              className={"sheet count-" + count}
              style={{ zoom: Math.min((typeof window !== "undefined" ? window.innerWidth : 380) - 56, 380) / (210 * PX_PER_MM) }}
            >
              {slots.map((slot, i) => (
                <PreviewCell
                  key={i}
                  slot={slot}
                  isFirstRow={i < cols}
                  isFirstCol={i % cols === 0}
                  onTap={() => openCellEditor(i)}
                />
              ))}
            </div>
          </div>
        </React.Fragment>
      )}

      {/* The real, print-accurate sheet. Always present so printing works from
          any step; never shown on-screen on mobile (the preview above stands in
          for it) and forced visible by the print stylesheet. */}
      <div className="sheet-shell" style={isMobile ? { display: "none" } : undefined}>
        <div className={"sheet count-" + count}>
          {slots.map((slot, i) => (
            <Cell
              key={i}
              slot={slot}
              isFirstRow={i < cols}
              isFirstCol={i % cols === 0}
              onUpload={(img) => updateSlot(i, { image: img, rotation: 0, flip: false, scale: 1, x: 0, y: 0, fit: "fit" })}
              onRotate={(delta) => updateSlot(i, { rotation: (slot.rotation + delta + 360) % 360 })}
              onFlip={() => updateSlot(i, { flip: !slot.flip })}
              onZoom={(scale) => updateSlot(i, { scale })}
              onDrag={(x, y) => updateSlot(i, { x, y })}
              onRemove={() => updateSlot(i, emptySlot())}
              onCaption={(caption) => updateSlot(i, { caption })}
              onOrientation={(orientation) => updateSlot(i, { orientation })}
              onFrameStyle={(frame) => updateSlot(i, { frame })}
              onFit={(fit) => updateSlot(i, { fit })}
            />
          ))}
        </div>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
